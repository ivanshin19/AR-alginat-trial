<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AR Modul 1 · Manipulasi Alginat</title>
<style>
  :root{--teal:#1f6f6b;--ink:#ffffff;--amber:#e8aa3c;--shade:rgba(10,24,24,.72)}
  html,body{margin:0;height:100%;background:#000;color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #ar{position:fixed;inset:0}
  .bar{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:linear-gradient(var(--shade),transparent);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .bar b{font-weight:600}
  .bar small{display:block;opacity:.8;font-size:12px}
  .hint{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:20;text-align:center;background:var(--shade);border-radius:12px;padding:10px 14px;transition:opacity .25s}
  .foot{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{appearance:none;border:0;border-radius:999px;padding:11px 18px;font:600 14px/1 inherit;background:var(--teal);color:var(--ink);text-decoration:none;cursor:pointer}
  .btn.alt{background:var(--shade);border:1px solid rgba(255,255,255,.35)}
  #start{position:fixed;inset:0;z-index:30;background:var(--teal);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
  #start h1{margin:0;font:700 28px/1.2 Georgia,"Times New Roman",serif}
  #start p{margin:0;max-width:34ch;opacity:.9}
  #start .btn{background:var(--amber);color:#1d2a2c;font-size:16px;padding:14px 26px}
  #err{color:#ffd7d7}
  .yt{width:1000px;height:562px;border:0;background:#000}
  [hidden]{display:none!important}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/jsm/",
  "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
} }
</script>
</head>
<body>
<div id="start">
  <h1>Modul 1 · Manipulasi Alginat</h1>
  <p>Izinkan kamera, lalu arahkan HP ke poster di meja lab. Video demonstrasi akan muncul di atas poster.</p>
  <button class="btn" id="go" type="button">Mulai kamera</button>
  <p id="err" hidden></p>
</div>

<div id="ar"></div>
<div class="bar"><div><b>ITMKG I · Modul 1</b><small>FKG UK Petra</small></div></div>
<div class="hint" id="hint">Arahkan kamera ke poster “Manipulasi Alginat”</div>
<div class="foot">
  <a class="btn alt" id="full" target="_blank" rel="noopener">Buka video layar penuh</a>
</div>

<script type="module">
import * as THREE from "three";
import { CSS3DObject } from "three/addons/renderers/CSS3DRenderer.js";
import { MindARThree } from "mindar-image-three";

const VIDEO_ID = "nypwDSOOM38";          // ganti ID YouTube di sini
const TARGET   = "./penanda.mind";       // file penanda hasil kompilasi

document.getElementById("full").href = "https://www.youtube.com/watch?v=" + VIDEO_ID;
const hint = document.getElementById("hint");

const mindar = new MindARThree({
  container: document.getElementById("ar"),
  imageTargetSrc: TARGET,
  uiScanning: "no",
  filterMinCF: 0.0001, filterBeta: 0.001
});
const { renderer, cssRenderer, scene, cssScene, camera } = mindar;

const frame = document.createElement("iframe");
frame.className = "yt";
frame.allow = "autoplay; encrypted-media; picture-in-picture";
frame.allowFullscreen = true;
frame.src = "https://www.youtube-nocookie.com/embed/" + VIDEO_ID + "?enablejsapi=1&playsinline=1&rel=0&modestbranding=1";
const obj = new CSS3DObject(frame);
// elemen 1000px = lebar poster (konvensi MindAR untuk CSS anchor)
const anchor = mindar.addCSSAnchor(0);
anchor.group.add(obj);

const yt = cmd => frame.contentWindow?.postMessage(JSON.stringify({ event: "command", func: cmd, args: [] }), "*");
anchor.onTargetFound = () => { hint.style.opacity = 0; yt("playVideo"); };
anchor.onTargetLost  = () => { hint.style.opacity = 1; yt("pauseVideo"); };

document.getElementById("go").addEventListener("click", async () => {
  const err = document.getElementById("err");
  try {
    await mindar.start();
    document.getElementById("start").hidden = true;
    renderer.setAnimationLoop(() => { renderer.render(scene, camera); cssRenderer.render(cssScene, camera); });
  } catch (e) {
    err.hidden = false;
    err.textContent = "Kamera tidak bisa dibuka. Pastikan izin kamera diberikan dan halaman dibuka lewat https, lalu coba lagi.";
    console.error(e);
  }
});
</script>
</body>
</html>
